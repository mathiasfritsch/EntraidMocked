services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev --import-realm
    volumes:
      - ./keycloak/local-realm.json:/opt/keycloak/data/import/local-realm.json:ro
      - ./keycloak/certs:/opt/keycloak/certs:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # MSAL.js refuses non-https authorities, so Keycloak must serve TLS.
      KC_HOSTNAME: https://localhost:8443
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/localhost.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/localhost.key
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  keycloak-db-data:
